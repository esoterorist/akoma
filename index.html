<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><script>try{var t=localStorage.getItem("ant.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script></head><body>
<title>Akoma Ntoaso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<style>
/* Layout: a patch canvas. Transport bar across the top, an endless dotted drafting field of nodes
   (Clock, machines, buses, Output, Rec) joined by wires, and a machine dock that rises from the bottom.
   Same tokens as the series: ink hairlines, drafting crosshairs, one yellow signal. */
:root{
  --bg:#c9c8c1; --surface:#d6d5ce; --cell:#cfcec7; --ink:#0d0d0c; --mute:#57564f; --faint:rgba(13,13,12,.10); --faint2:rgba(13,13,12,.22); --grid:rgba(13,13,12,.20);
  --sig:#ffc83a; --sig-ink:#0d0d0c; --live:#3d42d1; --warn:#c8361f;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f0e; --surface:#171715; --cell:#1d1d1b; --ink:#e7e5db; --mute:#8d8b82; --faint:rgba(231,229,219,.08); --faint2:rgba(231,229,219,.22); --grid:rgba(231,229,219,.14);
  --sig:#ffc83a; --sig-ink:#0d0d0c; --live:#9296ff; --warn:#ff6b4e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f0e; --surface:#171715; --cell:#1d1d1b; --ink:#e7e5db; --mute:#8d8b82; --faint:rgba(231,229,219,.08); --faint2:rgba(231,229,219,.22); --grid:rgba(231,229,219,.14);
  --sig:#ffc83a; --sig-ink:#0d0d0c; --live:#9296ff; --warn:#ff6b4e; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,label,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--live);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--ink);position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:9px;min-width:0;margin-right:4px}
.brand svg{width:26px;height:26px;flex:none}
.brand h1{margin:0;font-weight:800;font-size:22px;line-height:1;letter-spacing:-.045em;font-stretch:86%;white-space:nowrap}
.brand .sub{font:500 8.5px/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sp{flex:1}
.chip{border:1.5px solid var(--ink);border-radius:999px;padding:5px 12px 4px;font:500 11px/1.2 var(--mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap;background:transparent}
.chip.hot{background:var(--sig);color:var(--sig-ink)}
.chip.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.chip.pos{min-width:92px;text-align:center}
button.chip{cursor:pointer}
button.chip:hover{background:var(--faint2)}

.btn{appearance:none;border:1px solid var(--ink);background:transparent;padding:0 12px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0;transition:background .12s,color .12s;user-select:none;-webkit-user-select:none;white-space:nowrap;touch-action:manipulation}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--ink);color:var(--bg)}
.btn.solid:hover{background:var(--sig);color:var(--sig-ink)}
.btn[aria-pressed="true"]{background:var(--sig);color:var(--sig-ink)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.big{min-width:78px}
.btn.sm{min-height:26px;padding:0 9px;font-size:9px}
.btn .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.recbtn[data-st="armed"] .dot,.recbtn[data-st="ending"] .dot{border-color:var(--warn);animation:blink .5s steps(2) infinite}
.recbtn[data-st="rec"] .dot{background:var(--warn);border-color:var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.tempo{display:flex;align-items:stretch;border:1px solid var(--ink)}
.tempo button{appearance:none;border:0;background:transparent;width:28px;cursor:pointer;font:600 13px var(--mono)}
.tempo button:hover{background:var(--faint2)}
.tempo label{display:flex;align-items:center;gap:6px;padding:0 8px;border-inline:1px solid var(--ink)}
.tempo label span{font:500 9px var(--mono);letter-spacing:.14em;color:var(--mute)}
.tempo input{width:58px;min-height:30px;border:0;background:transparent;font:700 16px var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding:0;-moz-appearance:textfield}
.tempo input::-webkit-inner-spin-button{-webkit-appearance:none}

/* the work area: canvas on top, machine dock below */
.work{position:relative;flex:1;min-height:0;overflow:hidden}
.canvas{position:absolute;left:0;right:0;top:0;height:var(--ch,100%);overflow:hidden;touch-action:none;z-index:2;outline:none;
  background-color:var(--bg);background-image:radial-gradient(circle,var(--grid) 1px,transparent 1.4px);background-size:24px 24px}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.moving{will-change:transform}
.wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.w{fill:none;stroke:var(--faint2);stroke-width:2;stroke-linecap:round}
.w.live{stroke:var(--ink);stroke-width:2.5}
.w.clk{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5}
.w.dead{stroke-dasharray:2 6}
.w.sel{stroke:var(--sig);stroke-width:4;stroke-dasharray:none}
.w.tmp{stroke:var(--sig);stroke-width:2.5;stroke-dasharray:7 5}
/* key wires: the sidechain. Blue dash-dot, never sound, so they never go ink */
.w.key{stroke:var(--live);stroke-width:1.75;stroke-dasharray:7 4 1.5 4}
.w.key.live{stroke:var(--live);stroke-width:2.75}
.w.key.sel{stroke:var(--sig);stroke-width:4;stroke-dasharray:none}
/* send wires: a machine playing into the shared Reverb or Dub Delay. Thin and dotted; ink while sound flows */
.w.snd{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:1 5}
.w.snd.live{stroke:var(--ink);stroke-width:2.25;stroke-dasharray:1 4}
.w.snd.dead{stroke-dasharray:1 10}
.w.snd.sel{stroke:var(--sig);stroke-width:4;stroke-dasharray:none}
/* mod wires: a control voltage, not sound. Thin orange, long dash; solid while the mod is moving its knob */
.w.note{stroke:var(--live);stroke-width:1.75;stroke-dasharray:2 3 6 3}
.w.note.live{stroke-width:2.75;stroke-dasharray:none}
.w.note.sel{stroke:var(--sig);stroke-width:4;stroke-dasharray:none}
.port.note{top:58px;border-color:var(--live);border-radius:50%;width:11px;height:11px}
.n-nt .port.note{top:15px}
.port.note.on{background:var(--live)}
.port.note:hover,.port.note.ok{background:var(--sig)}
.n-nt .fd{grid-template-columns:44px minmax(0,1fr) 50px}
.ntact{display:flex;gap:3px;align-items:center;min-height:14px;font:500 9px/1 var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.ntact b{display:inline-block;min-width:26px;padding:2px 3px;border:1px solid var(--faint2);text-align:center;color:var(--ink);font-weight:600}
.ntact b.hot{background:var(--live);border-color:var(--live);color:var(--bg)}
.w.mod{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:9 4;opacity:.75}
.w.mod.live{opacity:1;stroke-width:2}
.w.mod.sel{stroke:var(--sig);stroke-width:4;stroke-dasharray:none;opacity:1}
.port.mod{border-color:var(--warn);border-radius:2px}
.port.mod.on{background:var(--warn)}
.world.wiring .node.mok{outline:2px dashed var(--warn);outline-offset:5px}
.n-mod .fd{grid-template-columns:44px minmax(0,1fr) 56px}
.mscope{position:relative;height:40px;border:1px solid var(--faint2);contain:strict}
.mscope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mtg{display:grid;gap:4px}
.mtg .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center;border-top:1px solid var(--faint2);padding-top:5px}
.mtg .tn{font:600 9.5px/1.25 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mtg .tn small{font-weight:500;color:var(--mute)}
.mtg .row .fd{grid-column:1/-1}
.mtg .xb{appearance:none;border:1px solid var(--ink);background:transparent;width:22px;height:20px;cursor:pointer;font:600 11px/1 var(--mono)}
.mtg .xb:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
.n-mod select.tsel{width:100%}
.macbig{font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}

/* nodes */
.node{position:absolute;left:0;top:0;width:var(--w);background:var(--surface);border:1px solid var(--ink);user-select:none;-webkit-user-select:none}
.node::before,.node::after{content:"";position:absolute;width:11px;height:11px;pointer-events:none;
  background:linear-gradient(var(--ink),var(--ink)) center/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) center/100% 1px no-repeat}
.node::before{top:-6px;left:-6px}.node::after{bottom:-6px;right:-6px}
.node.sel{outline:2px solid var(--sig);outline-offset:5px}
.nh{height:42px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--ink);cursor:grab;touch-action:none}
.nh:active{cursor:grabbing}
.nh b{font:800 17px/1 var(--display);letter-spacing:-.03em;font-stretch:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nh i{font:500 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-style:normal;margin-left:auto;white-space:nowrap}
.node.open .nh{background:var(--ink);color:var(--bg)}
.node.open .nh i{color:var(--sig)}
.node.open .nh .led{border-color:var(--bg)}
.nb{padding:10px 12px 12px;display:grid;gap:8px}
.kind{font:500 8.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:start}
.led.rec{background:var(--warn);border-color:var(--warn);animation:blink 1s steps(2) infinite}
.port{position:absolute;top:15px;width:12px;height:12px;border:1.5px solid var(--ink);background:var(--surface);cursor:crosshair;touch-action:none;z-index:1}
.port::after{content:"";position:absolute;inset:-10px}
.port.in{left:-7px}.port.out{right:-7px}
.port.clk{border-radius:50%}
.port.on{background:var(--ink)}
.port:hover{background:var(--sig)}
.port.ok{background:var(--sig);box-shadow:0 0 0 4px var(--sig)}
.world.wiring .port:not(.ok):not(.src){opacity:.3}
/* the Duck node's Key input: a blue diamond on the left edge, level with the Key row */
.port.key{top:58px;border-color:var(--live);transform:rotate(45deg)}
.port.key.on{background:var(--live)}
/* a shared effect's In: sends arrive here (dot in the middle) */
.port.snd::before{content:"";position:absolute;left:2px;top:2px;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.port.snd.on::before{background:var(--surface)}
.port.snd:hover::before,.port.snd.ok::before{background:var(--sig-ink)}
.n-fx .fd{grid-template-columns:44px minmax(0,1fr) 44px}
.seg.tight button{padding:0 6px}
.fxrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.port.key:hover,.port.key.ok{background:var(--sig)}
.keyrow{height:24px;display:flex;align-items:center;gap:8px;min-width:0}
.keyrow .lbl{color:var(--live);flex:none}
.keyrow .kt{font:600 10px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.keyrow .kt.warn{color:var(--warn);font-weight:500}
.meter.gr i{background:var(--sig);transform-origin:100% 0}
.meter.gr b{inset:0 -1px 0 0;border-left:0;border-right:2px solid var(--ink)}
.shape{position:relative;height:38px;border:1px solid var(--faint2)}
.shape svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.shape .dip{fill:var(--sig);opacity:.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shape .dip{opacity:.92}}
:root[data-theme="dark"] .shape .dip{opacity:.92}
.shape .cv{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.shape .tk{stroke:var(--live);stroke-width:3;vector-effect:non-scaling-stroke}
.grtxt{font:500 10px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
/* the EQ node: a response display you can drag, the four bands, and the Sweep slide for the selected band */
.n-eq .fd{grid-template-columns:40px minmax(0,1fr) 58px}
.fd.off input,.fd.off output{opacity:.3;pointer-events:none}
.eqv{position:relative;height:122px;border:1px solid var(--faint2);touch-action:none;cursor:crosshair;contain:strict;overflow:hidden}
.eqv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.eqv .gl{stroke:var(--faint2);stroke-width:1}
.eqv .g0{stroke:var(--mute);stroke-width:1;stroke-dasharray:2 3}
.eqv .gt{font:500 7.5px var(--mono);fill:var(--mute);letter-spacing:.04em}
.eqv .spc{fill:var(--faint2);stroke:none}
.eqv .bnd{fill:var(--sig);opacity:.55}
.eqv .swl{stroke:var(--sig);stroke-width:2}
.eqv .cv{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linejoin:round}
.eqv .h rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.eqv .h text{font:700 7.5px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.eqv .h.on rect{fill:var(--sig);stroke:var(--sig-ink)}
.eqv .h.on text{fill:var(--sig-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eqv .bnd{opacity:.8}}
:root[data-theme="dark"] .eqv .bnd{opacity:.8}
.n-eq.byp .eqv .cv{stroke-dasharray:4 3;opacity:.45}
.n-eq.byp .eqv .bnd,.n-eq.byp .eqv .h{opacity:.4}
.seg.full{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.n-sat .fd{grid-template-columns:44px minmax(0,1fr) 58px}
.satv{position:relative;height:122px;border:1px solid var(--faint2);touch-action:none;cursor:ns-resize;contain:strict;overflow:hidden}
.satv svg,.satcv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.satv .gl,.satcv .gl{stroke:var(--faint2);stroke-width:1}
.satv .g0,.satcv .g0{stroke:var(--mute);stroke-width:1;stroke-dasharray:2 3}
.satv .g1{stroke:var(--warn);stroke-width:1;stroke-dasharray:1 3;opacity:.7}
.satv .gd{stroke:var(--faint2);stroke-width:1;stroke-dasharray:3 3}
.satv .gt,.satcv .gt{font:500 7.5px var(--mono);fill:var(--mute);letter-spacing:.04em}
.satv .pkt{fill:var(--ink);font-weight:600}
.satv .lit{fill:none;stroke:var(--sig);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.satv .cv,.satcv .cv{fill:none;stroke:var(--ink);stroke-width:1.75;stroke-linejoin:round}
.satv .pd{fill:var(--sig);stroke:var(--sig-ink);stroke-width:1}
.satcv{position:relative;height:48px;border:1px solid var(--faint2);touch-action:none;cursor:crosshair;contain:strict;overflow:hidden}
.satcv .cfill{fill:var(--sig);opacity:.5}
.satcv .chd{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.satg{display:grid;gap:inherit}
.satg[hidden]{display:none}
.seg.sc button:nth-child(-n+4){border-bottom:1px solid var(--ink)}
.seg.sc button:nth-child(4){border-right:0}
.satk{font:500 9px/1.35 var(--mono);color:var(--mute);min-height:2.7em}
.n-sat.byp .satv .cv{stroke-dasharray:4 3;opacity:.45}
.n-sat.byp .satv .lit{opacity:.3}
.seg.full button{padding:0 2px}
.sweep{display:grid;gap:1px}
.swtop{display:flex;align-items:baseline;gap:8px;min-width:0}
.swtop .swb{color:var(--ink);font-weight:600}
.swnum{margin-left:auto;font:700 19px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
.sweep input[type=range]{height:32px}
.sweep input[type=range]::-webkit-slider-runnable-track{height:5px}
.sweep input[type=range]::-webkit-slider-thumb{width:14px;height:30px;margin-top:-12.5px;background:var(--sig);box-shadow:0 0 0 1.5px var(--ink)}
.sweep input[type=range]:active::-webkit-slider-thumb{background:var(--ink)}
.sweep input[type=range]::-moz-range-track{height:5px}
.sweep input[type=range]::-moz-range-progress{height:5px}
.sweep input[type=range]::-moz-range-thumb{width:14px;height:30px;background:var(--sig);border:1.5px solid var(--ink);border-radius:0}
.swtk{position:relative;height:9px;font:500 7.5px/1 var(--mono);color:var(--mute);letter-spacing:.04em}
.swtk span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.eqmode{min-height:26px;display:flex;align-items:center;gap:8px}
.eqmode .kind{text-transform:none;letter-spacing:.04em}
/* the Master node: loudness on top, then the chain in the order the sound goes through it */
.n-mst .fd{grid-template-columns:50px minmax(0,1fr) 54px}
.lutop{display:flex;align-items:baseline;gap:6px;min-width:0}
.lubig{font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
.lubig small{font:500 8.5px var(--mono);letter-spacing:.12em;color:var(--mute);margin-left:5px}
.lutop .lbl{margin-left:auto;white-space:nowrap}
.lubar{height:10px;background:var(--faint2);position:relative;overflow:hidden;contain:strict}
.lubar .tg{position:absolute;top:0;bottom:0;z-index:1;box-shadow:inset 0 0 0 2px var(--sig);background:rgba(255,200,58,.28)}
.lubar i{position:absolute;inset:0;background:var(--ink);opacity:.82;transform-origin:0 0;transform:scaleX(0);will-change:transform}
.lubar b{position:absolute;inset:0 0 0 -1px;border-left:2px solid var(--live);transform:translateX(0);will-change:transform}
.lurow{display:flex;flex-wrap:wrap;gap:3px 10px;font:500 9.5px/1.35 var(--mono);font-variant-numeric:tabular-nums;color:var(--mute);letter-spacing:.02em}
.lurow b{color:var(--ink);font-weight:600}
.lurow .warn,.lurow .warn b{color:var(--warn)}
.msec{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;border-top:1px solid var(--faint2);padding-top:9px;margin-top:2px}
.msec>.lbl{color:var(--ink);font-weight:600}
.msec .meter{min-width:20px}
.n-mst .ms[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* zoomed out: names only, big enough to read */
.world.far .x{display:none}
.world.far .nh b{font-size:28px}
.world.far .nh i{display:none}

.led{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.led.on{background:var(--sig);border-color:var(--sig)}
.led.q{animation:blink .5s steps(2) infinite;background:var(--sig);border-color:var(--sig)}
.launch[data-st="armed"]{background:var(--ink);color:var(--bg)}
.launch[data-st="playing"]{background:var(--sig);color:var(--sig-ink)}
.launch[data-st="queued"]{animation:qblink .5s steps(2) infinite}
@keyframes qblink{50%{background:var(--sig);color:var(--sig-ink)}}
.state{font:500 9px/1.35 var(--mono);letter-spacing:.05em;color:var(--mute);min-height:12px;font-variant-numeric:tabular-nums}
.state.warn{color:var(--warn)}
/* meters move on the compositor only: transform, never width / left */
.meter{height:6px;background:var(--faint2);position:relative;overflow:hidden;contain:strict}
.meter i{position:absolute;inset:0;background:var(--ink);transform-origin:0 0;transform:scaleX(0);will-change:transform}
.meter b{position:absolute;inset:0 0 0 -1px;border-left:2px solid var(--ink);transform:translateX(0);will-change:transform}
.meter.hot i{background:var(--warn)}.meter.hot b{border-color:var(--warn)}
.fd{display:grid;grid-template-columns:36px minmax(0,1fr) 44px;align-items:center;gap:6px}
.fd label{font:500 8.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fd output{font:500 10px/1 var(--mono);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;--p:50%;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--ink) var(--p),var(--faint2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:20px;margin-top:-8.5px;background:var(--ink);border:0;border-radius:0}
input[type=range]:active::-webkit-slider-thumb{background:var(--sig);box-shadow:0 0 0 1px var(--ink)}
input[type=range]::-moz-range-track{height:3px;background:var(--faint2);border:0}
input[type=range]::-moz-range-progress{height:3px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:10px;height:20px;background:var(--ink);border:0;border-radius:0}
.msrow{display:flex;align-items:center;gap:4px}
.krow{display:flex;align-items:center;gap:4px;margin-top:6px}.krow .lbl{min-width:28px;font:500 8.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}.krow .tsel{flex:1;min-width:0}.krow .tsel:disabled{opacity:.45}
.ms{appearance:none;border:1px solid var(--ink);background:transparent;min-height:24px;min-width:28px;font:600 9px var(--mono);cursor:pointer;padding:0 6px;touch-action:manipulation;letter-spacing:.08em;text-transform:uppercase}
.ms:hover{background:var(--faint2)}
.ms.m[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.ms.s[aria-pressed="true"]{background:var(--live);border-color:var(--live);color:#fff}
.ck{margin-left:auto;font:500 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.ck.on{color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--ink);width:max-content;max-width:100%}
.seg button{appearance:none;border:0;border-right:1px solid var(--ink);background:transparent;min-height:24px;padding:0 8px;font:600 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--faint2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lbl{font:500 8.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.optrow .lbl{min-width:46px}

.bpmbig{font:700 36px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.bpmbig small{font:500 9px var(--mono);letter-spacing:.14em;color:var(--mute);margin-left:6px}
.scope{position:relative;height:52px;border:1px solid var(--faint2);contain:strict}
.scope canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pk{font:500 10px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.recstate{font:700 15px/1.2 var(--display);letter-spacing:-.01em;min-height:18px}
.recstate small{display:block;font:500 9px/1.45 var(--mono);letter-spacing:.04em;color:var(--mute);margin-top:3px}
.takes{display:grid;gap:6px;max-height:168px;overflow:auto;overscroll-behavior:contain}
.take{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;border:1px solid var(--ink);padding:6px 6px 6px 9px}
.take b{font:700 12px/1.15 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.take span{grid-column:1/-1;font:500 8.5px/1.4 var(--mono);color:var(--mute);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.take .acts{display:flex;gap:4px}
.empty{font:400 9.5px/1.5 var(--mono);color:var(--mute);margin:0;border:1px dashed var(--faint2);padding:8px 9px}

.cut{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;border:1px solid var(--ink);background:var(--sig);color:var(--sig-ink);font:600 15px/1 var(--mono);cursor:pointer;padding:0;z-index:2}

/* canvas overlays */
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;right:12px;display:flex;flex-wrap:wrap;gap:4px 14px;pointer-events:none;
  font:500 8.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.hud b{color:var(--ink);font-weight:600}
.menu{position:absolute;z-index:8;width:270px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.menu h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--ink);font:500 9px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.menu button{appearance:none;display:grid;width:100%;text-align:left;gap:3px;padding:9px 12px;border:0;border-bottom:1px solid var(--faint2);background:transparent;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--sig);color:var(--sig-ink);outline:none}
.menu button b{font:800 16px/1 var(--display);letter-spacing:-.02em;font-stretch:88%}
.menu button span{font:500 8.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.menu p{margin:0;padding:9px 12px;font:400 9.5px/1.5 var(--mono);color:var(--mute)}

/* machine dock */
.dockhead{position:absolute;left:0;right:0;top:var(--ch);height:34px;z-index:4;display:flex;align-items:center;gap:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--surface);cursor:ns-resize;touch-action:none;
  font:500 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.dockhead .grip{width:26px;height:5px;border-block:1px solid var(--mute);flex:none}
.dockhead .nm{font:800 15px/1 var(--display);letter-spacing:-.02em;text-transform:none;font-stretch:88%}
.dockhead .mut{color:var(--mute);overflow:hidden;text-overflow:ellipsis;min-width:0}
.dockhead .btn{cursor:pointer}
.frames{position:absolute;left:0;right:0;bottom:0;height:var(--fh,60%);z-index:1;visibility:hidden;pointer-events:none;contain:strict}
.frames.on{visibility:visible;pointer-events:auto;z-index:3}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);visibility:hidden}
.frames.on iframe.on{visibility:visible}

/* the Arranger: sections across, machines down, each column as wide as its bars. It rises into the dock slot. */
.arrp{position:absolute;left:0;right:0;bottom:0;height:var(--fh,60%);z-index:3;background:var(--bg);display:flex;flex-direction:column;min-height:0}
.atb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ink);background:var(--surface)}
.asum{font:500 9px/1.3 var(--mono);letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.tlw{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:16px}
.tl{position:relative;display:grid;width:max-content;min-width:100%;grid-auto-rows:auto}
.tl .rh{position:sticky;left:0;z-index:3;background:var(--surface);border-right:1px solid var(--ink);border-bottom:1px solid var(--faint2);padding:0 10px 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;height:46px}
.tl .rh.corner{height:56px;border-bottom-color:var(--ink)}
.rh b{font:800 14px/1 var(--display);letter-spacing:-.02em;font-stretch:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh span{font:500 8px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh.warn span{color:var(--warn)}
.sh{appearance:none;text-align:left;border:0;border-right:1px solid var(--faint2);border-bottom:1px solid var(--ink);background:var(--surface);padding:9px 10px 8px;display:grid;align-content:space-between;gap:4px;cursor:pointer;min-width:0;height:56px;position:relative;color:inherit}
.sh b{font:800 17px/1 var(--display);letter-spacing:-.03em;font-stretch:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh span{font:500 8.5px/1 var(--mono);letter-spacing:.04em;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh:hover{background:var(--faint2)}
.sh.now{background:var(--ink);color:var(--bg)}
.sh.now span{color:var(--sig)}
.sh.start::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--sig)}
.sh.next{animation:qblink .5s steps(2) infinite}
.cell{appearance:none;border:0;border-right:1px solid var(--faint2);border-bottom:1px solid var(--faint2);background:transparent;color:inherit;height:46px;padding:0 10px;display:flex;align-items:center;gap:7px;cursor:pointer;font:700 13px/1 var(--mono);text-align:left;min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell>span{flex:none}
.cell i{font:500 8.5px/1 var(--mono);color:var(--mute);font-style:normal;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:.04em}
.cell:not(.on)>span{color:var(--mute);font-weight:500}
.cell.on{background:var(--cell)}
.cell.cont>span{color:var(--mute)}
.cell.empty i{color:var(--warn)}
.cell.live{background:var(--sig);color:var(--sig-ink)}
.cell.live i,.cell.live.cont>span{color:var(--sig-ink)}
.cell:hover{outline:1px solid var(--ink);outline-offset:-1px}
.cell:disabled{cursor:default;opacity:.35;outline:0}
.tl .rh.hasarm{padding-right:34px}
.armb{position:absolute;right:6px;top:50%;margin-top:-11px;width:22px;height:22px;border:1px solid var(--mute);border-radius:50%;background:transparent;padding:0;cursor:pointer}
.armb::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--mute)}
.armb:hover{border-color:var(--ink)}
.armb[aria-pressed="true"]{border-color:var(--warn)}
.armb[aria-pressed="true"]::before{background:var(--warn)}
.tl .rh.tph{height:38px;border-bottom-color:var(--faint2)}
.tp{position:relative;height:38px;border-bottom:1px solid var(--faint2);background:var(--faint);min-width:0}
.tp .sb{position:absolute;top:0;bottom:0;width:1px;background:var(--faint2);pointer-events:none}
.tp .hint{position:sticky;left:calc(var(--namew,150px) + 10px);display:inline-block;font:500 9px/38px var(--mono);letter-spacing:.04em;color:var(--mute);white-space:nowrap;pointer-events:none}
.clip{position:absolute;top:4px;bottom:4px;appearance:none;border:1px solid var(--ink);background:var(--ink);padding:0;cursor:pointer;overflow:hidden;min-width:4px;touch-action:manipulation}
.clip svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.clip .wv{fill:var(--bg)}
.clip .lw{stroke:var(--sig);stroke-width:1;vector-effect:non-scaling-stroke;fill:none}
.clip.sel{background:var(--sig);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);z-index:1}
.clip.sel .wv{fill:var(--sig-ink)}
.clip.sel .lw{stroke:var(--sig-ink)}
.clip.lost{background:repeating-linear-gradient(135deg,var(--faint2) 0 4px,transparent 4px 8px)}
.clip .ge{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.recblk{position:absolute;top:4px;bottom:4px;width:0;background:var(--warn);opacity:.75;pointer-events:none}
.cell.taped>span{color:var(--mute);font-weight:500}
.cell.taped i{color:var(--mute)}
.cedit{padding:4px 8px;border:1px solid var(--ink);background:var(--bg)}
.ph{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--ink);z-index:2;pointer-events:none;will-change:transform}
.pick{position:fixed;z-index:12;width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto;background:var(--surface);border:1px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.pick h3{margin:0;padding:8px 12px;border-bottom:1px solid var(--ink);font:500 9px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.pick p{margin:0;padding:0 12px 10px;font:400 9px/1.5 var(--mono);color:var(--mute)}
.prow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:9px 12px}
.prow+.prow{border-top:1px solid var(--faint2)}
.pgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:2px 12px 10px}
.pgrid button{appearance:none;border:1px solid var(--ink);background:transparent;color:inherit;min-height:30px;font:600 10px/1 var(--mono);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.pgrid button:hover{background:var(--faint2)}
.pgrid button.dim{border-color:var(--faint2);color:var(--mute)}
.pgrid button.cur{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.pgrid button[aria-pressed="true"]{background:var(--sig);color:var(--sig-ink);border-color:var(--ink)}
.pgrid button:disabled{opacity:.3;cursor:default}
.pacts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--faint2)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#fff}
.tin{width:100%;min-height:34px;border:1px solid var(--ink);background:var(--bg);padding:0 9px;font:800 16px/1 var(--display);letter-spacing:-.02em}
.prow output{font:500 10px/1 var(--mono);min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
/* Arranger v2: scene colours, the scene strip, drag handles, the Scenes launcher */
.cell.on{box-shadow:inset 3px 0 0 var(--scol,transparent)}
.cell.live{box-shadow:none}
.sh{touch-action:pan-x pan-y;padding-top:11px}
.sh .sc,.lh .sc{position:absolute;left:0;right:0;top:0;height:4px;background:var(--scol,transparent);pointer-events:none}
.sh span{padding-right:10px}
.sh.drag{z-index:6;box-shadow:4px 4px 0 var(--ink);cursor:grabbing;background:var(--surface)}
.sh.sizing{background:var(--sig);color:var(--sig-ink)}
.sh.sizing span{color:var(--sig-ink)}
.grip{position:absolute;top:8px;bottom:4px;right:0;width:16px;cursor:ew-resize;touch-action:none;z-index:1}
.grip::before{content:"";position:absolute;right:5px;top:50%;height:16px;margin-top:-8px;width:3px;border-left:1px solid var(--mute);border-right:1px solid var(--mute)}
.sh:hover .grip::before,.sh.sizing .grip::before{border-color:currentColor}
.sh.now .grip::before{border-color:var(--bg)}
.ins{position:absolute;top:0;bottom:0;left:0;width:4px;margin-left:-2px;background:var(--sig);box-shadow:0 0 0 1px var(--ink);z-index:7;pointer-events:none}
.tl .rh.sub{height:34px;border-bottom-color:var(--ink)}
.ss{appearance:none;border:0;border-right:1px solid var(--faint2);border-bottom:1px solid var(--ink);background:transparent;color:inherit;height:34px;padding:0 8px;display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0;font:600 10px/1 var(--mono);text-align:left}
.ss .dot,.slist .dot{width:9px;height:9px;flex:none;background:var(--scol)}
.ss b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ss span{color:var(--mute);font-weight:500;margin-left:auto;flex:none}
.ss:hover{background:var(--faint2)}
.lh{position:relative;border-right:1px solid var(--faint2);border-bottom:1px solid var(--ink);background:var(--surface);height:56px;min-width:0}
.lh .go{appearance:none;border:0;background:transparent;color:inherit;width:100%;height:100%;padding:11px 30px 8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;row-gap:5px;align-content:center;text-align:left;cursor:pointer;min-width:0}
.lh .tri{grid-row:1/3;align-self:center;width:0;height:0;border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
.lh b{font:800 17px/1 var(--display);letter-spacing:-.03em;font-stretch:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lh .u{font:500 8.5px/1 var(--mono);letter-spacing:.04em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lh .go:hover{background:var(--faint2)}
.lh.now{background:var(--ink);color:var(--bg)}
.lh.now .u{color:var(--sig)}
.lh.now .tri{border:0;width:11px;height:11px;background:var(--sig)}
.lh.next{animation:qblink .5s steps(2) infinite}
.lh .more{position:absolute;top:10px;right:4px;appearance:none;border:0;background:transparent;color:inherit;width:24px;height:28px;font:700 13px/1 var(--mono);cursor:pointer;padding:0}
.lh .more:hover{background:var(--faint2)}
.lh.addc{appearance:none;font:600 20px/1 var(--mono);cursor:pointer;color:var(--mute);border-right:0}
.lh.addc:hover{background:var(--faint2);color:var(--ink)}
.fillc{border-bottom:1px solid var(--faint2)}
.slist{display:grid;gap:4px;padding:8px 12px}
.slist button{appearance:none;border:1px solid var(--faint2);background:transparent;color:inherit;display:flex;align-items:center;gap:8px;min-height:32px;padding:0 10px;font:600 11px/1 var(--mono);cursor:pointer;text-align:left}
.slist button:hover{border-color:var(--ink)}
.slist button[aria-pressed="true"]{border-color:var(--ink);background:var(--cell);box-shadow:inset 3px 0 0 var(--sig)}
.slist span{margin-left:auto;color:var(--mute);font-weight:500}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{appearance:none;width:24px;height:24px;border:1px solid var(--ink);background:var(--c);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.qn{display:flex;flex-wrap:wrap;gap:4px}
.qn button{appearance:none;border:1px solid var(--faint2);background:transparent;color:inherit;min-height:24px;padding:0 7px;font:600 9px/1 var(--mono);letter-spacing:.04em;cursor:pointer}
.qn button:hover{border-color:var(--ink)}
.tsel{min-height:26px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);font:600 9.5px var(--mono);padding:0 6px;max-width:100%;border-radius:0}
/* automation lanes, under the machines in the Song view */
.tl .rh.auh{height:34px;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--ink);border-bottom-color:var(--ink)}
.aufill{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 8px;font:500 8.5px/1.3 var(--mono);letter-spacing:.04em;color:var(--mute);white-space:nowrap;overflow:hidden;height:34px}
.tl .rh.lane{height:58px;padding-right:32px;position:sticky}
.tl .rh.lane::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.tl .rh.lane.live::before{background:var(--sig)}
.tl .rh.lane.wr::before{background:var(--warn)}
.rh.lane .more{position:absolute;top:15px;right:4px;appearance:none;border:0;background:transparent;color:inherit;width:24px;height:28px;font:700 13px/1 var(--mono);cursor:pointer;padding:0}
.rh.lane .more:hover{background:var(--faint2)}
.rh.lane .back{align-self:flex-start;min-height:20px;border-color:var(--warn);color:var(--warn)}
.rh.lane .back:hover{background:var(--warn);color:#fff}
.rh.lane span{font-variant-numeric:tabular-nums}
.lc{position:relative;height:58px;border-right:1px solid var(--faint2);border-bottom:1px solid var(--faint2);touch-action:none;cursor:crosshair;min-width:0;
  background:repeating-linear-gradient(90deg,var(--faint2) 0 1px,transparent 1px var(--bw,48px)),linear-gradient(var(--faint),var(--faint)) 0 50%/100% 1px no-repeat}
.lc svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lc .ar{fill:var(--ink);opacity:.07}
.lc .ln{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.lc .cy{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.lc .pt{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.lc .pt.hot{fill:var(--sig)}
.lc:hover{outline:1px solid var(--ink);outline-offset:-1px}
.lpick{display:grid;gap:2px;padding:6px 0}

<script>
(() => {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const el = (t, a, ...k) => { const e = document.createElement(t); if (a) for (const n in a) { if (a[n] == null) continue; if (n.startsWith('on')) e[n] = a[n]; else e.setAttribute(n, a[n]); } for (const c of k) if (c != null) e.append(c); return e; };

const DEVS = [
  // irv: the machine has reverb sends of its own; inside the rack they play into the shared Reverb instead
  // nap: every note it plays starts new source nodes, so it can rest while playing and silent, and wake on the next start
  // ide: the machine has delay sends of its own; in Super Lean they play into the shared Dub Delay instead
  { id: 'dwennimmen', name: 'Dwennimmen', code: 'DWN—09', kind: '909 drum machine', src: 'dev/dwennimmen.html', irv: true, ide: true, nap: true, nout: true, nin: true },
  { id: 'akoben', name: 'Akoben', code: 'AKB—03', kind: '303 acid line', src: 'dev/akoben.html', irv: true, ide: true, nout: true, nin: true, mono: true },
  { id: 'hextrig', name: 'Hextrig', code: 'HX—6', kind: 'FM groovebox', src: 'dev/hextrig/index.html', irv: true, ide: true, nap: true, nout: true },
  { id: 'nkonsonkonson', name: 'Nkonsonkonson', code: 'NKN—08', kind: 'sample sequencer', src: 'dev/nkonsonkonson.html', irv: true, ide: true, nap: true, nout: true, nin: true },
  { id: '101', name: '101', code: 'SH—101', kind: 'mono synth', src: 'dev/101.html', nout: true, nin: true, mono: true },
  { id: 'ananse', name: 'Ananse Ntontan', code: 'ANS—12', kind: 'string machine', src: 'dev/ananse.html', irv: true, ide: true, nout: true, nin: true },
  { id: 'nkyinkyim', name: 'Nkyinkyim', code: 'NKY—32', kind: 'random bleeps', src: 'dev/nkyinkyim.html', irv: true, ide: true, nout: true },
  { id: 'hyewonhye', name: 'Hye Wo Nhye', code: 'HWN—MX', kind: 'EMX-1 groovebox', src: 'dev/hyewonhye.html', nap: true, nout: true },
  { id: 'mframadan', name: 'Mframadan', code: 'MFR—64', kind: 'granular texture', src: 'dev/mframadan.html', irv: true, ide: true, nin: true },
  { id: 'funtunfunefu', name: 'Funtunfunefu', code: 'FTF—16', kind: 'sampler + sequencer', src: 'dev/funtunfunefu.html', irv: true, ide: true, nap: true, nout: true, nin: true },
  { id: 'fawohodie', name: 'Fawohodie', code: 'FWH—60', kind: 'Juno-type poly', src: 'dev/fawohodie.html', irv: true, ide: true, nout: true, nin: true },
  { id: 'asaseyeduru', name: 'Asase Ye Duru', code: 'AYD—08', kind: '808 drum machine', src: 'dev/asaseyeduru.html', irv: true, ide: true, nout: true, nin: true },
];
// what a machine does with the notes it takes in (shown on its notes-in port)
const NIH = {
  dwennimmen: 'GM drum notes hit its voices (36 kick, 38 snare, 42 / 46 hats …)',
  asaseyeduru: 'GM drum notes hit its sounds (36 kick, 38 snare, 42 / 46 hats …)',
  nkonsonkonson: '36–43 hit tracks 1–8; 48 and up play slices of the selected track',
  funtunfunefu: '36–51 hit pads 1–16; other notes play the selected pad, pitched (60 = as sampled)',
  mframadan: 'notes open the selected cloud at their pitch (60 = as written)',
  '101': 'played like its keys: plays, feeds the arp, or transposes a running sequence',
};
const MAX_BUS = 4, MAX_DUCK = 4, MAX_EQ = 4, MAX_SAT = 4, MAX_MOD = 8, MAX_NT = 8;
const NODE_W = { clock: 212, machine: 236, bus: 200, out: 236, rec: 264, duck: 236, fx: 236, mst: 280, eq: 280, sat: 280, mod: 248, nt: 224 };
const MST_LAT = 31;   // frames the Master chain holds the mix back (its 2× oversampling filters), at every sample rate
// the shared send effects: one of each
const FXS = ['verb', 'dub'], FXN = { verb: 'Reverb', dub: 'Dub Delay' };
const PORT_Y = 21;   // every port sits on the header's centre line, so wires never need a layout read
const KEY_Y = 64;
const NOTE_Y = 64;   // a machine's note in / out sit level with its first body row, below its clock in and audio out    // except a Duck's Key input, pinned level with its first body row
// machines most likely to carry a kick, in the order a new Duck looks for its key
const DRUMS = ['dwennimmen', 'asaseyeduru', 'hextrig', 'hyewonhye', 'nkonsonkonson', 'funtunfunefu'];

function typeOf(id) {
  if (id === 'clock' || id === 'out' || id === 'rec' || id === 'mst') return id;
  if (DEVS.some(x => x.id === id)) return 'machine';
  if (/^bus[1-4]$/.test(id)) return 'bus';
  if (/^duck[1-4]$/.test(id)) return 'duck';
  if (/^eq[1-4]$/.test(id)) return 'eq';
  if (/^sat[1-4]$/.test(id)) return 'sat';
  if (/^mod[1-8]$/.test(id)) return 'mod';
  if (/^nt[1-8]$/.test(id)) return 'nt';
  if (id === 'verb' || id === 'dub') return 'fx';
  return '';
}
const MODT = { lfo: 'LFO', rnd: 'Random', env: 'Envelope', mac: 'Macro' };
const modName = id => { const c = st.mod && st.mod[id]; return (c ? MODT[c.t] : 'Mod') + ' ' + id.slice(3); };
const NTT = { tr: 'Transpose', fl: 'Filter', ch: 'Chance', sc: 'Scale', cd: 'Chord', ar: 'Arp', dl: 'Echo' };
const ntName = id => { const c = st.nt && st.nt[id]; return (c ? NTT[c.t] : 'Notes') + ' ' + id.slice(2); };
const nameOf = id => (typeOf(id) === 'nt' ? ntName(id) : typeOf(id) === 'mod' ? modName(id) : D[id] ? D[id].name : FXN[id] || (typeOf(id) === 'bus' ? 'Bus ' + id.slice(3) : typeOf(id) === 'duck' ? 'Duck ' + id.slice(4) : typeOf(id) === 'eq' ? 'EQ ' + id.slice(2) : typeOf(id) === 'sat' ? 'Saturator ' + id.slice(3) : id === 'out' ? 'Output' : id === 'mst' ? 'Master' : id));
// What may connect to what: Clock → machine (sync), machine → bus, Duck or Output, Duck → bus or Output, bus → Output,
// Output → Rec, or Output → Master → Rec (the Master chain is an insert on the Output: you hear it and Rec takes it). Key wires (k: 'key') run from a machine to a Duck's Key: they listen, they carry no sound.
// Send wires (k: 'snd') run from a machine into a shared effect (and from the Dub Delay into the Reverb). They are not
// stored: each one is drawn from a send level, so the knob and the wire never disagree.
// Ducks take machines and effect returns, so a path never meets two Ducks and never loops.
// An EQ is an insert anywhere on the way out: machines, effect returns, Ducks, buses and other EQs go in; it goes on to
// a bus, another EQ or the Output (never into a Duck: Ducks push channels down at the source). Buses and EQs can feed
// each other, so those wires are checked for loops. A Saturator is an insert just like an EQ (same wiring rules).
/* Mod wires (k: 'mod') run from a modulation node to one rack knob: w.p = the knob (an automation-lane key), w.d = depth
   (−1…1 of that knob's whole range). A node can take several, one per knob. */
function modKeysOf(id) {
  const ty = typeOf(id);

// the Arp plays from the host timer, a little ahead, on the Clock's grid

  if (!H.ctx) return;
  for (const id in st.nt) {
    const c = st.nt[id]; if (c.t !== 'ar') continue;
    const S1 = NTS[id]; if (!S1) continue;
    const A = S1.arp; if (!A.held.length || A.p == null) continue;
    let guard = 0;
    while (tAt(A.p) < now + 0.15 && guard++ < 32) {
      const tp = tAt(A.p);
      const on = A.held.filter(h => h.t0 <= tp + 0.003 && h.t1 > tp + 0.003);
      if (!on.length) { if (A.held.every(h => h.t1 <= tp + 0.003)) { A.held = []; A.p = null; break; } A.p += c.ad; continue; }
      const base = [...new Set(on.map(h => h.n))].sort((a, b) => a - b), seq = [];

      else if (c.am === 'down') idx = seq.length - 1 - (A.i % seq.length);
      else if (c.am === 'ud' && seq.length > 1) { const L = 2 * seq.length - 2, k = A.i % L; idx = k < seq.length ? k : L - k; }

      noteRoute(id, { k: 'off', n, v: 0, t: Math.max(tAt(A.p + c.ad * c.ag), now + 0.01), u });

}

    g.fillStyle = C.ink; g.fillText(t, tx, 36);
  }
  if (MX.capEl._t !== cap) { MX.capEl._t = cap; MX.capEl.innerHTML = cap.replace(/^Spectrum/, '<b>Spectrum</b>'); }
}
// 1–9 while the Mixer is open: mute the strip; Shift: solo it
function mixKey(n, solo) { const s = MX.list[n]; if (!s) return; if (solo) { if (s.ty === 'machine') stripSolo(s); } else stripMute(s); }

function frame(t) {
  requestAnimationFrame(frame);
  const dt = lastFrame ? Math.min(100, t - lastFrame) : 16.7; lastFrame = t;
  const ctx = H.ctx;
  if (ctx) {
    for (const id of VIEW) {
      const x = S[id]; if (!x) continue;
      const ty = typeOf(id);
      if (ty === 'duck') { if (!WORLD._far) { const k = DK[id]; grMeter(id, x, dt, k && k.envAn ? Math.min(1, peakOf(k.envAn)) : 0); } continue; }
      if (ty === 'mst') { mstFrame(x, dt); continue; }   // its loudness stays readable when zoomed out
      if (ty === 'eq') { if (!WORLD._far) { meter(id, x, dt, EQ[id] && EQ[id].an); eqFrame(id, x, t); } continue; }
      if (ty === 'sat') { if (!WORLD._far) { meter(id, x, dt, SAT[id] && SAT[id].an); satFrame(id, x, performance.now()); } continue; }
      if (ty === 'mod') { if (!WORLD._far) modFrame(id, x, t); continue; }
      if (ty === 'nt') { if (!WORLD._far) ntFrame(id, x); continue; }
      if (!x.meter) continue;
      if (ty === 'machine') { const d = D[id]; meter(id, x, dt, d.ch && !d.asleep ? d.ch.an : null); }
      else if (ty === 'bus') meter(id, x, dt, B[id] && B[id].an);
      else if (ty === 'fx') meter(id, x, dt, FX[id] && FX[id].an);
      else if (ty === 'out') meter('out', x, dt, M.an);
    }
    if (H.playing) {
      const p = heardPos();
      txt(POS, p < 0 ? '—.—.—' : (Math.floor(p / 16) + 1) + '.' + (Math.floor((p % 16) / 4) + 1) + '.' + (Math.floor(p % 4) + 1));
      tog(POS, 'hot', true);
    } else { txt(POS, '—.—.—'); tog(POS, 'hot', false); }
  }
  drawScope(t);
  luChip(t);
  arrFrame(t);
  laneFrame();
  if (st.open === MIX_ID) mixFrame(t, dt);
  if (dirty || t - lastSlow > 120) { lastSlow = t; renderSlow(t); audioHealth(t); }
  if (takesShown !== rec.takes.length) { takesShown = rec.takes.length; renderTakes(); }
  machineFrames(t);
}

/* ---------- wiring the page ---------- */
$('#bPlay').onclick = () => { ensureCtx(); play(); };
$('#bStop').onclick = () => { ensureCtx(); stop(); };
$('#bRec').onclick = recButton;
$('#bAdd').onclick = () => showAdd(Math.max(12, CVW - 290), 12, false);
$('#bSess').onclick = () => showSession();
$('#bTheme').onclick = () => setTheme(THEMES[(THEMES.indexOf(theme) + 1) % 3]);
setTheme(theme);
$('#bLean').onclick = () => setLean(!st.lean);
$('#bSup').onclick = () => setSup(!st.sup);
leanButtons();
$('#bFit').onclick = fit;
$('#cZoom').onclick = () => zoomAt(CVW / 2, CVH / 2, 1 / cam.z);
const bpmIn = $('#bpm');
bpmIn.onchange = () => setTempo(+bpmIn.value);
bpmIn.onkeydown = e => { if (e.key === 'Enter') { setTempo(+bpmIn.value); bpmIn.blur(); } };
$('#tDn').onclick = e => setTempo(H.bpm - (e.shiftKey ? 1 : 0.1));
$('#tUp').onclick = e => setTempo(H.bpm + (e.shiftKey ? 1 : 0.1));
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA' || tg.isContentEditable)) return;
  if (clipKeys(e)) { e.preventDefault(); return; }
  if (st.open === ARR_ID && st.arr && (e.metaKey || e.ctrlKey) && !e.altKey && (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'y')) { e.preventDefault(); undo(e.key.toLowerCase() === 'y' || e.shiftKey); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape' && !PICK.hidden) { hidePick(); return; }
  if (st.open === ARR_ID && st.arr && !e.repeat) {
    if (e.shiftKey && /^Digit[1-9]$/.test(e.code)) { const sc = st.arr.scenes[+e.code.slice(5) - 1]; if (sc) launchScene(sc.id); e.preventDefault(); return; }
    if (e.key.toLowerCase() === 'v' && !(tg && tg.closest && tg.closest('.pick'))) { setView(st.arr.view === 'scenes' ? 'song' : 'scenes'); return; }
  }
  if (st.open === MIX_ID && !e.repeat && /^Digit[1-9]$/.test(e.code)) { e.preventDefault(); mixKey(+e.code.slice(5) - 1, e.shiftKey); return; }
  if (e.key === 'Escape') { if (!MENU.hidden) hideMenu(); else if (st.open) closeDock(); else setSel(null); return; }
  if (e.code === 'Space') { if (tg && tg.closest && tg.closest('.menu,.pick')) return; e.preventDefault(); if (e.repeat) return; ensureCtx(); H.playing ? stop() : play(); return; }
  if (e.repeat) return;
  if (e.key === 'Tab' && !st.open && (tg === document.body || tg === CV)) { e.preventDefault(); const r = CV.getBoundingClientRect(); showAdd(clamp((LM.x || CVW / 2) - r.left, 12, CVW), clamp((LM.y || CVH / 2) - r.top, 12, CVH), !!LM.x); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && SEL && !(tg && tg.closest && tg.closest('.menu'))) { e.preventDefault(); if (SEL.wire) removeWire(SEL.wire); else if (SEL.node) removeNode(SEL.node); return; }
  if (tg && tg.tagName === 'BUTTON' && e.key === 'Enter') return;
  const k = e.key.toLowerCase();
  if (k === 'enter' && SEL && SEL.node && typeOf(SEL.node) === 'machine') openMachine(SEL.node);
  else if (k === 'r') recButton();
  else if (k === 'c') { st.click = !st.click; save(); render(); }
  else if (k === 't') tap();
  else if (k === 'a') { if (st.open === ARR_ID) closeDock(); else openArr(); }
  else if (k === 'm') { if (st.open === MIX_ID) closeDock(); else openMix(); }
  else if (k === 'f') fit();
  else if (k === '0') zoomAt(CVW / 2, CVH / 2, 1 / cam.z);
  else if (k === '-' || k === '_') setTempo(H.bpm - (e.shiftKey ? 1 : 0.1));
  else if (k === '=' || k === '+') setTempo(H.bpm + (e.shiftKey ? 1 : 0.1));
  else if (/^[1-9]$/.test(k)) { const d = DEVS[+k - 1]; if (st.nodes[d.id]) openMachine(d.id); else toast(d.name + ' is not on the canvas. Add it from + Add.'); }
});
const LM = { x: 0, y: 0 };
CV.addEventListener('pointermove', e => { LM.x = e.clientX; LM.y = e.clientY; }, { passive: true });
document.addEventListener('pointerdown', e => { if (!MENU.hidden && !e.target.closest('.menu') && !CV.contains(e.target)) hideMenu(); if (!PICK.hidden && !e.target.closest('.pick') && !(PK && PK.anchor && PK.anchor.contains(e.target))) hidePick(); });
$('#bArr').onclick = () => (st.open === ARR_ID ? closeDock() : openArr());
$('#bMix').onclick = () => (st.open === MIX_ID ? closeDock() : openMix());
$('#cSec').onclick = () => openArr();
buildArrBar();
clipBoot();
PICK.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); hidePick(); } });

new ResizeObserver(es => { WH = es[0].contentRect.height; layoutDock(); }).observe(WORK);
new ResizeObserver(es => {
  const r = es[0].contentRect; CVW = r.width; CVH = r.height;
  if (needFit && CVW > 40 && CVH > 40) { needFit = false; fit(); } else computeView();
}).observe(CV);
scopeColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', scopeColors);
new MutationObserver(scopeColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });

// build: nodes first, then load only the machines that are on the canvas
for (const id in st.nodes) buildNode(id);
for (const d of DL) if (st.nodes[d.id]) { d.c.sync = hasWire('clock', d.id); loadMachine(d); }
buildWires(); updatePorts();
applyCam();
renderTempo(); renderSlow(0);
requestAnimationFrame(frame);
})();
</script>


</body></html>
