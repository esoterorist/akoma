  return [P.rpt===1,P.rpt===2,P.rpt===3,P.rpt===5,P.rev,P.half,P.fill,P.brake,P.wash,P.echo,P.crush,P.lo,P.hi,P.kill[0],P.kill.slice(0,9).every(Boolean),P.kill.slice(9,14).every(Boolean)][k];

    case 4: P.rev = on; break;

    case 6: P.fill = on; refreshTransport(); break;
    case 7: P.brake = on; if(!on && S.playing && rackOn()) RACK.rejoin(); break;
    case 8: P.wash = on; if(G){ washLink(on); G.washSend.gain.setTargetAtTime(on?1:0,t,on?.02:.3); } break;
    case 9: P.echo = on; if(G){ G.echo.delayTime.setValueAtTime(.75*60/S.bpm,t); G.echoSend.gain.setTargetAtTime(on?1:0,t,.01); } break;
    case 10: P.crush = on; if(G){ G.crushDry.gain.setTargetAtTime(on?0:1,t,.01); G.crushWet.gain.setTargetAtTime(on?1:0,t,.01); } break;

    case 12: P.hi = on; applyDJ(); break;

let washT = 0, washOn = false;
function washLink(on){ clearTimeout(washT);

  washT = setTimeout(()=>{ if(!S.perf.wash && washOn){ washOn = false; try{ G.washSend.disconnect(G.wash); }catch(e){} } }, 6500); }
function perfClear(){ for(let k=0;k<16;k++) if(perfActive(k)) perfSet(k,false); renderSub(); }
function applyDJ(){
  if(!G) return; const t = AC.currentTime, rb = S.ribbon.mode==='FILTER' ? ribX : null;

}

function renderSteps(){
  stepsDirty = false;
  const p = pat(), m = S.keyMode, i = S.part, tr = p.tracks[i], L = tr.len||p.len;
  const playing = S.playing && CLOCK;
  let playIx = -1;
  if(playing && S.playPi===S.pi && S.playTotal!=null && seq) playIx = seq.idx(S.playTotal,L,S.perf);
  if(m==='step' && S.follow && playIx>=0){ const pg = Math.floor(playIx/16); if(pg!==S.page){ S.page = pg; renderSub(); } }
  SK.forEach((o,k)=>{
    let cls = 'skey', led = false, txt = '', cd = '', blink = false;
    if(m==='step'){
      const ix = S.page*16+k, st = tr.steps[ix];
      if(ix>=L) cls += ' off';
      led = !!st.on;
      if(st.locks && Object.keys(st.locks).length) cls += ' lk';
      if(st.on && (st.cond || (st.prob!=null && st.prob<100))){ cls += ' cn'; cd = st.cond || st.prob+'%'; }
      if(ix===playIx) { cls += ' play'; led = !led; }
      if(held===ix) cls += ' sel';
      if(st.on){ if(isSynth(i)) txt = noteName(st.note==null?48:st.note); else if((st.roll||1)>1) txt = '×'+st.roll; }
    } else if(m==='keys'){
      if(isSynth(i)){ const n = keyNote(k); txt = noteName(n); led = (S.audNote||48)===n; }
      else if(isDrum(i)) { txt = signed(k-4); led = k===4; }
      if(playIx>=0 && playIx%16===k) cls += ' play';
    } else if(m==='patt'){
      const j = S.bank*16+k; txt = patLabel(j); led = j===S.pi; blink = j===S.queued; if(!patUsed(S.patterns[j]) && !led && !blink) cls += ' off';
    } else if(m==='mute'){
      if(k<15){ txt = k===ACC?'ACC':isDrum(k)?'D'+PART_LABEL[k]:'S'+PART_LABEL[k]; led = !isMuted(k); }
      else { txt = 'SOLO'; led = S.soloMode; }
    } else { txt = PERF[k]; led = perfActive(k); }
    if(blink) cls += ' blink';
    if(o.last.c!==cls){ o.last.c = cls; o.key.className = cls; }
    if(o.last.l!==led){ o.last.l = led; o.led.classList.toggle('on',led); }
    if(o.last.t!==txt){ o.last.t = txt; o.txt.textContent = txt; }
    if(o.last.d!==cd){ o.last.d = cd; o.cd.textContent = cd; }
    const nm = m==='step' ? String(S.page*16+k+1).padStart(2,'0') : String(k+1).padStart(2,'0');
    if(o.last.n!==nm){ o.last.n = nm; o.num.textContent = nm; }
  });
}

function ribbonStart(){

    const dur = 60/S.bpm*ARP_RES[S.ribbon.res][1], now = AC.currentTime+.012;
    let g = now; if(S.playing && CLOCK){ g = CLOCK.t; while(g - dur > now) g -= dur; while(g < now) g += dur; }

}
function ribbonMove(){

}
function ribbonEnd(){

function bendVoices(semis,tc=.012){ if(!G) return; G.post({c:'bend', i:S.part, s:semis, tc}); }

}
function arpNote(t,dur){

    case 'UP': offs = [tri[i%4]]; break;
    case 'DOWN': offs = [tri[3-(i%4)]]; break;
    case 'UP-DN': offs = [[0,2,4,len,4,2][i%6]]; break;
    case 'RANDOM': offs = [tri[Math.floor(Math.random()*4)]]; break;
    case 'NOTE': offs = [0]; break;
    case 'CHORD': offs = [0,2,4]; break;
    case 'OCTAVE': offs = [i%2?len:0]; break;

  const part = S.part, base = S.kb.oct*12+S.ribbon.root;
  const nOf = d=> base + 12*Math.floor(d/len) + sc[((d%len)+len)%len];

  offs.forEach((o,k)=>{
    const note = nOf(deg+o);
    if(isSynth(part)) trigSynth(G,part,t,dur*.62,note,kit,{vel:.9,poly:k>0});
    else if(isDrum(part)) trigDrum(G,part,t,Object.assign({},kit,{pitch:clamp(kit.pitch+(note-base-12)/24,0,1)}),.9,0);

    }
  });
  VQ.push({t,k:'trig',i:part});
}

  fill:'<svg viewBox="0 0 16 16"><path d="M2 12h2V8H2zm3 0h2V5H5zm3 0h2V3H8zm3 0h2V1h-2z"/></svg>',

const TB = {};

    b.addEventListener('pointerdown',e=>{ e.preventDefault(); ensureAudio(); b.classList.add('press'); buzz(); down(); });

async function saveFile(name,data,statusEl){

  if(!dl){ if(statusEl) statusEl.textContent = 'Saving files isn’t available in this view. Open the artifact on claude.ai to export.'; return false; }
  try{ await dl.save({filename:name, data}); return true; }
  catch(e){ if(statusEl) statusEl.textContent = e && e.code==='declined' ? 'Save cancelled.' : 'Could not save ('+((e&&e.code)||'error')+').'; return false; }
}
function loopWrap(buf,n){

  for(let c=0;c<buf.numberOfChannels;c++){ const s = buf.getChannelData(c), d = out.getChannelData(c); d.set(s.subarray(0,n)); for(let i=n;i<s.length;i++) d[(i-n)%n] += s[i]; }
  return out;
}
async function doExport(btn,st){

    const render = async solo=>{

      if(E.tail===2) b = loopWrap(b,Math.min(lenS,b.length));

    };
    st.textContent = 'Rendering mix…';

    const files = [{name:base+'/'+base+'_mix.wav', data:wavBytes(mix,E.bits)}];

    if(ok) st.textContent = 'Saved '+base+'.zip · '+(blob.size/1048576).toFixed(1)+' MB · peak '+(20*Math.log10(Math.max(peak,1e-6))).toFixed(1)+' dBFS';
  }catch(e){ st.textContent = 'Export failed: '+(e && e.message || e); console.error(e); }
  btn.disabled = false;
}
$('fileIn').addEventListener('change',async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{ applyProject(JSON.parse(await f.text())); applyFx(); undoStack.length = 0; markDirty(); deckDirty = stepsDirty = true; renderRib(); toast('PROJECT LOADED'); }
  catch(err){ toast('NOT A HWN—MX PROJECT FILE'); }
  e.target.value = '';
});

/* ============================================================
   MIDI (Web MIDI where the browser allows it)
   ============================================================ */
function midiDesc(){ if(!MIDI) return ''; const ins = [...MIDI.inputs.values()].map(x=>x.name), outs = [...MIDI.outputs.values()].map(x=>x.name); return 'IN: '+(ins.join(', ')||'none')+' · OUT: '+(outs.join(', ')||'none'); }
async function initMidi(){
  const st = $('midiStatus');
  if(!navigator.requestMIDIAccess){ if(st) st.textContent = 'This browser has no Web MIDI.'; return; }
  try{ MIDI = await navigator.requestMIDIAccess(); }catch(e){ if(st) st.textContent = 'MIDI was blocked in this view. Open the artifact in a desktop browser tab to use MIDI.'; return; }
  const bind = ()=>{ for(const inp of MIDI.inputs.values()) inp.onmidimessage = midiIn; if($('midiStatus')) $('midiStatus').textContent = midiDesc(); };
  MIDI.onstatechange = bind; bind(); deckDirty = true;
}
const midiHolds = new Map();
function midiIn(m){
  const [s,d1,d2] = m.data, type = s&0xF0, ch = s&15;
  if(type!==0x90 && type!==0x80) return; ensureAudio();
  const on = type===0x90 && d2>0;
  let part = S.part, note = d1;
  if(ch===9){ const k = GM_DRUM.indexOf(d1); part = k>=0 ? k : (d1>=36 && d1<45 ? d1-36 : S.part); }
  else if(ch<5) part = 9+ch;
  const t = AC.currentTime, key = ch+':'+d1;
  if(on){
    const kit = editKit()[part];
    if(isDrum(part)){ trigDrum(G,part,t,kit,d2/127,0); if(S.rec&&S.playing) recStep(part,t,{vel:d2}); }
    else if(isSynth(part)){ const v = trigSynth(G,part,t,null,note,kit,{vel:d2/127}); const hd = {v,i:part,t,note}; midiHolds.set(key,hd); if(S.rec&&S.playing) hd.rec = recStep(part,t,{note,gate:1,vel:d2}); }
    flashUntil[part] = performance.now()+90;
  } else { const hd = midiHolds.get(key); if(hd){ midiHolds.delete(key); hd.v.release(t); if(hd.rec) finishGate(hd); } }
}
function perfTime(t){ return performance.now() + (t - AC.currentTime)*1000 + ((AC.outputLatency||0)+(AC.baseLatency||0))*1000; }
function midiOuts(){ return MIDI ? [...MIDI.outputs.values()] : []; }
let clockNext = 0;
function midiClock(t){ if(!S.midiClock || !MIDI || !CLOCK) return; const per = 60/S.bpm/24; if(clockNext < t-1) clockNext = t; while(clockNext < t+CLOCK.dur){ const pt = perfTime(clockNext); for(const o of midiOuts()) o.send([0xF8],pt); clockNext += per; } }
function midiStart(t0){ clockNext = t0; if(S.midiClock) for(const o of midiOuts()) o.send([0xFA],perfTime(t0)); }
function midiStop(){ if(S.midiClock) for(const o of midiOuts()) o.send([0xFC]); }
function midiNote(i,t,st){
  // rack note wires: drum parts as their GM note, synth parts at their pitch (the accent part sends nothing)
  if(window.RACK && RACK.notes && window.HWN_RKN && i!==ACC){
    const n = isDrum(i)?GM_DRUM[i]:clamp((st.note==null?48:st.note)+MAP.sPitch(pat().sounds[i].pitch),0,127), v = clamp(st.vel==null?100:st.vel,1,127);
    RACK.notes({k:'on',n,v,t}); RACK.notes({k:'off',n,v:0,t:t+(isDrum(i) ? .05 : CLOCK.dur*(st.gate==null?1:st.gate)*.95)});
  }
  if(!S.midiNotes || !MIDI) return;
  const ch = isDrum(i)?9:i-9, note = isDrum(i)?GM_DRUM[i]:clamp((st.note==null?48:st.note)+MAP.sPitch(pat().sounds[i].pitch),0,127), vel = clamp(st.vel==null?100:st.vel,1,127);
  const len = isDrum(i) ? .05 : CLOCK.dur*(st.gate==null?1:st.gate)*.95;
  for(const o of midiOuts()){ o.send([0x90|ch,note,vel],perfTime(t)); o.send([0x80|ch,note,0],perfTime(t+len)); }
}
function midiLive(i,note,on){ if(!S.midiNotes || !MIDI || i===ACC) return; const ch = isDrum(i)?9:i-9; for(const o of midiOuts()) o.send([on?0x90|ch:0x80|ch,note,on?100:0]); }

/* ============================================================
   FRAME LOOP
   ============================================================ */
const glowEls = [...document.querySelectorAll('.tube .glow')], filEls = [...document.querySelectorAll('.tube .fil')];
let lvlSmooth = 0, lastGlow = -1, lastMeter = -1;
function frame(){
  const now = AC ? AC.currentTime : 0, pnow = performance.now();
  while(VQ.length && VQ[0].t <= now){
    const e = VQ.shift();
    if(e.k==='step'){ S.playStep = e.n; S.playTotal = e.total; S.playPi = e.pi; stepsDirty = true; }
    else if(e.k==='trig'){ flashUntil[e.i] = pnow+80; }
    else if(e.k==='switch'){ deckDirty = true; stepsDirty = true; renderSub(); renderRib(); if(S.view==='song') deckDirty = true; }
  }
  if(deckDirty) renderDeck();
  if(stepsDirty) renderSteps();
  PK.forEach((k,i)=>{ const f = flashUntil[i] > pnow; if(k._f!==f){ k._f = f; k.classList.toggle('flash',f); } });
  let rms = 0;
  if(ANALYSER){ ANALYSER.getFloatTimeDomainData(abuf); let s = 0; for(let i=0;i<abuf.length;i+=2) s += abuf[i]*abuf[i]; rms = Math.sqrt(s/(abuf.length/2)); }
  lvlSmooth += (rms-lvlSmooth)*(rms>lvlSmooth?.5:.08);
  const g = Math.round(clamp(.28+S.master.tube*.35+lvlSmooth*2.4,0,1)*50)/50;
  if(g!==lastGlow){ lastGlow = g; for(const e of glowEls) e.style.opacity = g; for(const e of filEls) e.style.opacity = .45+g*.55; }
  const m = Math.round(clamp(lvlSmooth*3.2,0,1)*32)/32;
  if(m!==lastMeter){ lastMeter = m; $('meter').style.transform = 'scaleX('+m+')'; }
  renderLCD();
  requestAnimationFrame(frame);
}

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(e.repeat && e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(e.code==='Space'){ e.preventDefault(); ensureAudio(); S.playing ? stop() : play(); }
  else if(e.key==='r'||e.key==='R'){ S.rec = !S.rec; refreshTransport(); renderSub(); }
  else if(e.key==='f'||e.key==='F'){ S.perf.fill = true; refreshTransport(); }
  else if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); }
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ if(e.target.classList && e.target.classList.contains('dial')) return; S.part = (S.part+(e.key==='ArrowRight'?1:NPARTS-1))%NPARTS; held = null; deckDirty = stepsDirty = true; refreshParts(); renderRib(); }
  else if(e.key==='['||e.key===']'){ const p = pat(), L = p.tracks[S.part].len||p.len, bars = Math.ceil(L/16); S.page = (S.page+(e.key===']'?1:bars-1))%bars; S.follow = false; renderSub(); stepsDirty = true; }
  else if(e.key==='Escape'){ if(held!=null) closeStepEdit(); $('sheet').hidden = true; }
});
document.addEventListener('keyup',e=>{ if(e.key==='f'||e.key==='F'){ S.perf.fill = false; refreshTransport(); } });

/* ---------- boot ---------- */
load();
if(!tLock()) S.bpm = pat().bpm;
buildParts(); buildSteps(); buildTransport(); renderTabs(); renderModes(); renderSub(); renderRib(); refreshParts();
requestAnimationFrame(frame);
</script>
<script>
/* rack link: the rack owns the clock and tempo, this machine follows */
if(window.RACK){
  // fixed output delay in frames: the valve stage (4x oversampled shaper) that every part passes through.
  // Reported as a constant so the rack lines the dry parts up and never re-measures while notes come and go.
  // Parts sent through a Distortion or Compressor effect arrive a few ms later, exactly as on the machine itself.
  // one engine: the valve's 2× halfband = 47 frames at 44.1 kHz (was 192 with the browser's 4× shaper); Lean runs it at 1× = 0.
  // Before the worklet is up (or with the old graph as fallback) the old figures apply.
  const latency = ()=> G ? G.latency() : ((RACK.lean&&RACK.lean()) ? 0 : HWN_LAT);
  if(RACK.onLean) RACK.onLean(on=>{ if(G) G.setLean(on); });
  RACK.register({
    prepare(){ ensureAudio(); return Promise.resolve(); },
    playing: ()=> !!S.playing,
    latency,
    // note wires: every trig goes out while the rack listens, at the time it sounds (scheduled ahead)
    noteListen(on){ window.HWN_RKN = !!on; },
    getTempo: ()=> S.bpm,
    tempo(v){ S.bpm = Math.round(v*10)/10; if(G) retime(); deckDirty = true; markDirty(); },
    patterns: ()=> ({ n:64, cur: S.playing&&seq ? seq.pi : S.pi, label: patLabel, used: S.patterns.map(patUsed) }),
    cue(i,t){ i = Math.max(0,Math.min(63,i|0)); pat(i);
      if(!S.playing || !seq){ S.pi = i; S.bank = Math.floor(i/16); S.queued = -1; applyFx(); retime(); deckDirty = true; stepsDirty = true; markDirty(); return; }
      S.queued = -1; seq.cue = {pi:i, t}; deckDirty = true; },
    start(t0,p,pi){ ensureAudio(); RKS.self = true; RKS.arr = pi!=null;
      try{ if(S.playing) stop(); if(pi!=null){ pi = Math.max(0,Math.min(63,pi|0)); pat(pi); S.pi = pi; S.bank = Math.floor(pi/16); } play(t0); }finally{ RKS.self = false; } },
    stop(at){ if(!S.playing) return;
      if(at!=null && AC && at > AC.currentTime+.02){ RKS.stopAt = at; return; }
      RKS.self = true; try{ stop(); }finally{ RKS.self = false; } },
  });
}
</script>
